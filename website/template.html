<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="assets/sigma.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script>
  try { var t = localStorage.getItem("sigma-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="index.html">
    <img src="assets/sigma.svg" alt="" width="28" height="28">
    <span>Sigma</span>
    <span class="version">v{{version}}</span>
  </a>
  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search-input" type="search" placeholder="Search the docs" autocomplete="off" spellcheck="false"
           aria-label="Search the docs" aria-controls="search-results" aria-expanded="false">
    <kbd class="search-key" aria-hidden="true">/</kbd>
    <div id="search-results" class="search-results" role="listbox" hidden></div>
  </div>
  <nav class="top-links">
    <a href="{{repo}}">GitHub</a>
    <button class="icon-btn" id="theme-btn" aria-label="Switch between light and dark theme">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Documentation">
    {{sidebar}}
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="content" class="content">
    <article class="doc">
      <div class="eyebrow">{{section}}</div>
      {{content}}
      <footer class="doc-footer">
        <div class="pager">{{prev}}{{next}}</div>
        <p class="edit"><a href="{{edit}}">Edit this page on GitHub</a></p>
      </footer>
    </article>
    {{toc}}
  </main>
</div>
<script src="assets/site.js"></script>
</body>
</html>
